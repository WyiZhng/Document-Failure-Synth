source_cases:
  - data/source/task_001_002_raw
copies_per_case: 10
max_source_pages: 4          # 每份合成文档最多取源文档前 N 页素材
seed: 42
output_root: data/output/bilingual_v1
translate_categories: [text, paragraph_title, doc_title]
page:
  width: 1000                # CSS px,亦即截图像素宽
  height: 1414               # A4 比例
  margin: 40
  column_gap: 24
llm:
  model_env: SYNTH_LLM_MODEL
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  temperature: 0.7
  max_retries: 1
ocr:
  url: ""
  timeout: 300
