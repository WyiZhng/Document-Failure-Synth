source_cases:
  - task/source.txt                # 每行一个含 origin.json + fillin 的绝对路径
copies_per_case: 1             # 每个源 case 生成 1 个语义改写版本
max_workers: 4                 # 同时处理的语义改写 job 数
max_source_pages: null         # null 表示使用源文档全部页面
seed: 42
column_layouts: [zh-en, en-zh]  # 每个改写版本都生成两种布局:左中右英 / 左英右中
synchronize_bilingual_pairs: true  # 双语块成对换页，降低 Trainer 页面投影冲突
variants:
  - name: zh-en_no-cross
    column_layout: zh-en
    pagination_mode: no-cross
  - name: zh-en_cross
    column_layout: zh-en
    pagination_mode: cross
  - name: en-zh_no-cross
    column_layout: en-zh
    pagination_mode: no-cross
  - name: en-zh_cross
    column_layout: en-zh
    pagination_mode: cross
output_root: data/output/0714_0827
translate_categories: [text, paragraph_title, doc_title, table, table_title, form, form_title, footer, footnote, header, reference]
page:
  width: 1000                  # CSS px,亦即截图像素宽
  height: 1414                 # A4 比例
  margin: 40
  column_gap: 24
llm:
  model_env: SYNTH_LLM_MODEL
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  temperature: 0.7
  max_retries: 1
  batch_max_chars: 12000
ocr:
  url: ""
  timeout: 300
